[package]
name = "cineo-android"
description = "Rust half of the Android shell, exposed to Kotlin through UniFFI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
cineo-core.workspace = true
cineo-net.workspace = true
cineo-player.workspace = true
cineo-store.workspace = true
cineo-stream.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uniffi.workspace = true
url.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android_logger.workspace = true
jni.workspace = true
log.workspace = true
tracing = { workspace = true, features = ["log"] }
rustls-platform-verifier.workspace = true

[dev-dependencies]
librqbit.workspace = true
serde_json.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true
