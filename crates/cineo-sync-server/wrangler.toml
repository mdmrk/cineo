name = "cineo-sync"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-12"

[build]
command = "cargo install -q --locked worker-build@0.9.0 && worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "cineo-sync"
database_id = "2b6d47df-1f30-4b5c-a0ac-c15ba7550e67"

[[ratelimits]]
name = "REQUESTS"
namespace_id = "4301"

[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "NEW_SPACES"
namespace_id = "4302"

[ratelimits.simple]
limit = 10
period = 60

[triggers]
crons = ["17 * * * *"]
