name = "cineo-sync"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-12"

[build]
command = "cargo install -q --locked worker-build@0.9.0 && worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "cineo-sync"
database_id = "00000000-0000-0000-0000-000000000000"

[triggers]
crons = ["17 * * * *"]
