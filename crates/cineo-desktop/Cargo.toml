[package]
name = "cineo-desktop"
description = "Cineo desktop GUI shell (eframe/egui)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cineo-desktop"
path = "src/main.rs"

[features]
bundled-libmpv = []

[dependencies]
anyhow.workspace = true
cineo-core.workspace = true
cineo-net.workspace = true
cineo-player.workspace = true
cineo-store.workspace = true
cineo-stream.workspace = true
clap.workspace = true
eframe.workspace = true
fast_image_resize.workspace = true
fastframe-emoji.workspace = true
fastframe-file.workspace = true
fastframe-fonts.workspace = true
fastframe-graphics.workspace = true
fastframe-i18n.workspace = true
fastframe-instance.workspace = true
fastframe-log.workspace = true
fastframe-now-playing.workspace = true
fastframe-power.workspace = true
fastframe-scroll.workspace = true
fastframe-text.workspace = true
iconflow.workspace = true
image.workspace = true
raw-window-handle.workspace = true
semver.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[target.'cfg(not(windows))'.dependencies]
zbus.workspace = true

[target.'cfg(windows)'.dependencies]
keepawake.workspace = true

[build-dependencies]
fastframe-i18n = { workspace = true, features = ["build"] }

[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
