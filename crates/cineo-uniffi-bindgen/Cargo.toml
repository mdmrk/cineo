[package]
name = "cineo-uniffi-bindgen"
description = "UniFFI's binding generator, kept out of cineo-android so the bindings build without it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli", "cargo-metadata"] }

[lints]
workspace = true
