[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/cineo-desktop"]

[workspace.package]
version = "1.10.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/mdmrk/cineo"
publish = false

[workspace.metadata.android]
version-code = 11002

[workspace.dependencies]
cineo-core = { path = "crates/cineo-core" }
cineo-net = { path = "crates/cineo-net" }
cineo-player = { path = "crates/cineo-player" }
cineo-store = { path = "crates/cineo-store" }
cineo-stream = { path = "crates/cineo-stream" }

android_logger = { version = "0.15.1", default-features = false }
anyhow = "1.0.105"
aws-lc-rs = "1.19.0"
bytes = "1.12.2"
clap = { version = "4.6.9", features = ["derive"] }
data-encoding = "2.11.1"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard", "x11", "wayland", "accesskit", "links"] }
fast_image_resize = "6.2.0"
fastframe-dirs = { git = "https://github.com/crmne/fastframe", rev = "a7dc9bdb12319515c2bbb194054974b304deb36d" }
fastframe-emoji = { git = "https://github.com/crmne/fastframe", rev = "a7dc9bdb12319515c2bbb194054974b304deb36d" }
fastframe-file = { git = "https://github.com/crmne/fastframe", rev = "a7dc9bdb12319515c2bbb194054974b304deb36d" }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", rev = "a7dc9bdb12319515c2bbb194054974b304deb36d", default-features = false }
fastframe-graphics = { git = "https://github.com/crmne/fastframe", rev = "a7dc9bdb12319515c2bbb194054974b304deb36d" }
fastframe-i18n = { git = "https://github.com/crmne/fastframe", rev = "a7dc9bdb12319515c2bbb194054974b304deb36d" }
fastframe-instance = { git = "https://github.com/crmne/fastframe", rev = "a7dc9bdb12319515c2bbb194054974b304deb36d" }
fastframe-log = { git = "https://github.com/crmne/fastframe", rev = "a7dc9bdb12319515c2bbb194054974b304deb36d", default-features = false }
fastframe-now-playing = { git = "https://github.com/crmne/fastframe", rev = "a7dc9bdb12319515c2bbb194054974b304deb36d" }
fastframe-power = { git = "https://github.com/crmne/fastframe", rev = "a7dc9bdb12319515c2bbb194054974b304deb36d" }
fastframe-scroll = { git = "https://github.com/crmne/fastframe", rev = "a7dc9bdb12319515c2bbb194054974b304deb36d" }
fastframe-text = { git = "https://github.com/crmne/fastframe", rev = "a7dc9bdb12319515c2bbb194054974b304deb36d", features = ["watch"] }
flate2 = "1.1.11"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.13.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
iconflow = { version = "2.1.0", default-features = false, features = ["pack-tabler"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jni = { version = "0.22.4", default-features = false }
keepawake = { version = "0.6.1", default-features = false }
libloading = "0.9.1"
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls", "disable-upload"] }
log = "0.4.35"
minisign-verify = "0.3.0"
percent-encoding = "2.3.2"
raw-window-handle = "0.6.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "http2"] }
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
rustls-platform-verifier = "0.7.1"
semver = "1.0.28"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uniffi = { version = "0.32.2", default-features = false }
url = "2.5.9"
winresource = { version = "0.1.34", default-features = false }
worker = { version = "0.9.0", features = ["d1"] }
zeroize = "1.9.2"
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

egui_kittest = { version = "0.37.0", default-features = false }
tempfile = "3.27.0"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
large_futures = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
cloned_instead_of_copied = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
str_to_string = "warn"
rc_buffer = "warn"
mem_forget = "warn"
needless_continue = "warn"
uninlined_format_args = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
map_unwrap_or = "warn"
unnecessary_wraps = "warn"
manual_assert = "warn"
if_not_else = "warn"
inefficient_to_string = "warn"
verbose_file_reads = "warn"
empty_drop = "warn"
exit = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
librqbit = { git = "https://github.com/mdmrk/rqbit", branch = "main" }
