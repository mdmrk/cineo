[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Cineo is an application, not a library: MSRV == the pinned toolchain.
# Bump together with rust-toolchain.toml (see docs/DEVELOPMENT.md).
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/OWNER/cineo"
publish = false

[workspace.dependencies]
# Internal
cineo-core = { path = "crates/cineo-core" }
cineo-net = { path = "crates/cineo-net" }
cineo-player-mpv = { path = "crates/cineo-player-mpv" }
cineo-store = { path = "crates/cineo-store" }

# Every dependency is recorded in docs/dev/DEPENDENCIES.md with its justification.
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
etcetera = "0.11.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "http2"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
semver = "1.0.28"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "time", "process", "io-util", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"

# Dev-only
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Default clippy groups (correctness, suspicious, style, complexity, perf) stay on.
# Additions below are deliberate; see .claude/rules/rust.md before adding more.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
large_futures = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
cloned_instead_of_copied = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
match_same_arms = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
