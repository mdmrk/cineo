[workspace]
resolver = "3"
members = ["crates/*"]
# Patched third-party crates (vendor/README.md), not ours to lint.
exclude = ["vendor"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Cineo is an application, not a library: MSRV == the pinned toolchain.
# Bump together with rust-toolchain.toml (see docs/DEVELOPMENT.md).
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/OWNER/cineo"
publish = false

[workspace.dependencies]
# Internal
cineo-core = { path = "crates/cineo-core" }
cineo-net = { path = "crates/cineo-net" }
cineo-player = { path = "crates/cineo-player" }
cineo-store = { path = "crates/cineo-store" }
cineo-stream = { path = "crates/cineo-stream" }

# Every dependency is recorded in docs/DEVELOPMENT.md (Dependencies) with its justification.
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }
iconflow = { version = "2.1.0", default-features = false, features = ["pack-tabler"] }
etcetera = "0.11.0"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
libloading = "0.8.9"
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "http2"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
semver = "1.0.28"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }
tokio-util = { version = "0.7.19", default-features = false, features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"

# Dev-only
egui_kittest = { version = "0.36.2", default-features = false }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Default clippy groups (correctness, suspicious, style, complexity, perf) stay on.
# Additions below are deliberate; see docs/DEVELOPMENT.md (Lint policy) before adding more.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
large_futures = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
cloned_instead_of_copied = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
match_same_arms = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Dependencies (image decoding, BitTorrent, SQLite) are slow unoptimized;
# workspace crates stay at opt-level 0 so rebuilds remain fast.
[profile.dev.package."*"]
opt-level = 2

# librqbit 9.0.1 with Cineo's streaming patch (vendor/README.md).
[patch.crates-io]
librqbit = { path = "vendor/librqbit" }
