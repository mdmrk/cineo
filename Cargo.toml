[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/mdmrk/cineo"
publish = false

[workspace.dependencies]
cineo-core = { path = "crates/cineo-core" }
cineo-net = { path = "crates/cineo-net" }
cineo-player = { path = "crates/cineo-player" }
cineo-store = { path = "crates/cineo-store" }
cineo-stream = { path = "crates/cineo-stream" }

anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit", "links"] }
iconflow = { version = "2.1.0", default-features = false, features = ["pack-tabler"] }
etcetera = "0.11.0"
fluent-bundle = "0.16.0"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
libloading = "0.9.0"
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls", "disable-upload"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "http2"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
semver = "1.0.28"
sys-locale = "0.3.2"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }
tokio-util = { version = "0.7.19", default-features = false, features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unic-langid = { version = "0.9.6", features = ["macros"] }
url = "2.5.8"

egui_kittest = { version = "0.36.2", default-features = false }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
large_futures = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
cloned_instead_of_copied = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
match_same_arms = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2

# Branch fix/urgent-piece-helpers (ADR-0016).
[patch.crates-io]
librqbit = { git = "https://github.com/mdmrk/rqbit", rev = "be52c57a0d6c85d6d35467a2c8d5d60f66924aea" }
