[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.8.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/mdmrk/cineo"
publish = false

[workspace.dependencies]
cineo-core = { path = "crates/cineo-core" }
cineo-net = { path = "crates/cineo-net" }
cineo-player = { path = "crates/cineo-player" }
cineo-store = { path = "crates/cineo-store" }
cineo-stream = { path = "crates/cineo-stream" }

android_logger = { version = "0.15.1", default-features = false }
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit", "links"] }
keepawake = { version = "0.6.1", default-features = false }
log = "0.4.35"
jni = { version = "0.22.4", default-features = false }
iconflow = { version = "2.1.0", default-features = false, features = ["pack-tabler"] }
etcetera = "0.11.0"
fast_image_resize = "6.1.0"
fastframe-emoji = { git = "https://github.com/crmne/fastframe", tag = "v0.17.0" }
fastframe-file = { git = "https://github.com/crmne/fastframe", tag = "v0.17.0" }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.17.0", default-features = false }
fastframe-graphics = { git = "https://github.com/crmne/fastframe", tag = "v0.17.0" }
fastframe-instance = { git = "https://github.com/crmne/fastframe", tag = "v0.17.0" }
fastframe-log = { git = "https://github.com/crmne/fastframe", tag = "v0.17.0", default-features = false }
fastframe-now-playing = { git = "https://github.com/crmne/fastframe", tag = "v0.17.0" }
fastframe-power = { git = "https://github.com/crmne/fastframe", tag = "v0.17.0" }
fastframe-scroll = { git = "https://github.com/crmne/fastframe", tag = "v0.17.0" }
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.17.0", features = ["watch"] }
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
libloading = "0.9.0"
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls", "disable-upload"] }
percent-encoding = "2.3.2"
raw-window-handle = "0.6.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "http2"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
rust-i18n = "4.2.4"
rustls-platform-verifier = "0.7.1"
semver = "1.0.28"
sys-locale = "0.3.2"
serde_json = "1.0.154"
thiserror = "2.0.21"
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uniffi = "0.32.2"
url = "2.5.8"

egui_kittest = { version = "0.36.2", default-features = false }
tempfile = "3.27.0"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
large_futures = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
cloned_instead_of_copied = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
str_to_string = "warn"
rc_buffer = "warn"
mem_forget = "warn"
needless_continue = "warn"
uninlined_format_args = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
map_unwrap_or = "warn"
unnecessary_wraps = "warn"
manual_assert = "warn"
if_not_else = "warn"
inefficient_to_string = "warn"
verbose_file_reads = "warn"
empty_drop = "warn"
exit = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
librqbit = { git = "https://github.com/mdmrk/rqbit", branch = "main" }
