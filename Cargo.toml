[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Cineo is an application, not a library: MSRV == the pinned toolchain.
# Bump together with rust-toolchain.toml (see docs/DEVELOPMENT.md).
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OWNER/cineo"
publish = false

[workspace.dependencies]
# Empty on purpose: dependencies are added with the milestone that needs them.
# Candidates and their justification: docs/dev/DEPENDENCIES.md.

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Default clippy groups (correctness, suspicious, style, complexity, perf) stay on.
# Additions below are deliberate; see .claude/rules/rust.md before adding more.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
large_futures = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
cloned_instead_of_copied = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
match_same_arms = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
