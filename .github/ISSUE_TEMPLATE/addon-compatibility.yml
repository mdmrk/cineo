name: Addon compatibility
description: An addon that works in other protocol-compatible clients misbehaves in Cineo.
labels: [compatibility]
body:
  - type: input
    id: addon
    attributes:
      label: Addon name and public manifest URL
      description: Only a PUBLIC URL. Configured addons embed your settings/API keys in the URL — do not paste those.
    validations:
      required: true
  - type: textarea
    id: inspect
    attributes:
      label: Log lines from `cineo-desktop -v` while installing the addon
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
