name: setup android
description: Java, Gradle, cargo-ndk and the NDK pinned in scripts/libmpv-android.env
runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@v2.88.1
      with:
        tool: cargo-ndk@4.1.2
    - uses: actions/setup-java@v6.1.0
      with:
        distribution: temurin
        java-version: "21"
    - uses: gradle/actions/setup-gradle@v6.4.1
    - shell: bash
      run: |
        source scripts/libmpv-android.env
        echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
