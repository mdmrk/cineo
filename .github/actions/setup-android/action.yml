name: setup android
description: Java, Gradle, cargo-ndk pinned in scripts/android.env and the NDK pinned in scripts/libmpv-android.env
runs:
  using: composite
  steps:
    - id: pins
      shell: bash
      run: |
        source scripts/android.env
        echo "cargo-ndk=$CARGO_NDK_VERSION" >> "$GITHUB_OUTPUT"
    - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c
      with:
        tool: cargo-ndk@${{ steps.pins.outputs.cargo-ndk }}
    - uses: actions/setup-java@v6.3.0
      with:
        distribution: temurin
        java-version: "21"
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
    - shell: bash
      run: |
        source scripts/libmpv-android.env
        if [[ ! -f $ANDROID_HOME/ndk/$NDK_VERSION/source.properties ]]; then
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
        fi
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
