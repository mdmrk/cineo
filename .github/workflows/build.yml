name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version used in the file names (a tag, or "prerelease").
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: windows x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: macos arm64, os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install && rustup target add "$TARGET"
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build -p cineo-desktop --locked --release --target "$TARGET"
      - name: Package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: scripts/package.sh "$VERSION" "$TARGET"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cineo-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
