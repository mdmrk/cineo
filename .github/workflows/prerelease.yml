name: Prerelease

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prerelease
  cancel-in-progress: true

jobs:
  build:
    name: build
    if: github.ref == 'refs/heads/main'
    uses: $/.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  publish:
    name: publish prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cineo-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libmpv-windows
          path: libmpv
      - name: Mirror libmpv
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/mirror-libmpv.sh libmpv
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - name: Replace the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view prerelease --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete prerelease --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create prerelease dist/* --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" --title prerelease --notes ""
