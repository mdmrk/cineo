name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: checks
    uses: $/.github/workflows/ci.yml

  build:
    name: build
    needs: checks
    uses: $/.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cineo-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease \
            --title "$TAG" --generate-notes
