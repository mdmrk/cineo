# Builds the `cineo` CLI for each platform on a version tag and publishes a
# DRAFT release with SHA256SUMS and build provenance. A maintainer reviews and
# publishes the draft. See docs/DEVELOPMENT.md (Releasing).
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - name: Test
        run: cargo test --workspace --locked --release --target ${{ matrix.target }}
      - name: Build
        run: cargo build -p cineo-cli --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          TAG: ${{ github.ref_name }}
        run: |
          name="cineo-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          bin="target/${TARGET}/release/cineo"
          [[ "$TARGET" == *windows* ]] && bin="${bin}.exe"
          cp "$bin" README.md LICENSE "dist/$name/"
          cd dist
          if [[ "$ARCHIVE" == zip ]]; then 7z a "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
          rm -rf "$name"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft $prerelease \
            --title "$TAG" --notes "Verify downloads with SHA256SUMS and \`gh attestation verify\`."
