name: ci

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NEXTEST_PROFILE: ci

jobs:
  linux:
    name: check (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - &checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - &rust-cache
        uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2.88.1
        with:
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2
      - run: scripts/check.sh

  windows:
    name: check (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - *checkout
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - *rust-cache
      - uses: taiki-e/install-action@v2.88.1
        with:
          tool: cargo-nextest@0.9.150
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked

  android:
    name: check (android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - *checkout
      - run: rustup toolchain install stable --profile minimal --component clippy --target aarch64-linux-android && rustup default stable
      - *rust-cache
      - uses: ./.github/actions/setup-android
      - run: cargo ndk -t arm64-v8a -P 26 clippy -p cineo-android --locked -- -D warnings
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
        working-directory: android

  build:
    name: build (${{ matrix.platform }})
    needs: [linux, windows, android]
    if: &release-push >-
      github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') ||
      !startsWith(github.event.head_commit.message, 'chore(release):'))
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux, os: ubuntu-latest }
          - { platform: windows, os: windows-latest, features: bundled-libmpv }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions: &attest
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - *checkout
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - &rust-cache-untagged
        uses: Swatinem/rust-cache@v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch libmpv
        if: matrix.features == 'bundled-libmpv'
        run: |
          scripts/fetch-libmpv.sh libmpv
          echo "CINEO_LIBMPV_DLL=$(cygpath -m "$PWD/libmpv/libmpv-2.dll")" >> "$GITHUB_ENV"
      - run: cargo build -p cineo-desktop --locked --release ${FEATURES:+--features "$FEATURES"}
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v2
          FEATURES: ${{ matrix.features }}
      - run: scripts/package.sh "$PLATFORM"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  build-android:
    name: build (android)
    needs: [linux, windows, android]
    if: *release-push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: *attest
    steps:
      - *checkout
      - run: rustup toolchain install stable --profile minimal --target aarch64-linux-android && rustup default stable
      - *rust-cache-untagged
      - uses: ./.github/actions/setup-android
      - id: libmpv
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@v6.1.0
        with:
          path: |
            target/libmpv-android/out
            target/libmpv-android/pins
          key: libmpv-android-${{ hashFiles('scripts/build-libmpv-android.sh', 'scripts/libmpv-android.env') }}
      - if: steps.libmpv.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build > /dev/null
      - run: base64 -d <<<"$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/cineo-release.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - run: scripts/release-android.sh
        env:
          CINEO_KEYSTORE: ${{ runner.temp }}/cineo-release.jks
          CINEO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CINEO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CINEO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: rm -rf build prefix src venv cross.ini libmpv-android-arm64-v8a.tar.xz
        working-directory: target/libmpv-android
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: [build, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- * > SHA256SUMS
      - name: Publish the release or the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then
            prerelease=""
            [[ "$TAG" == *-* ]] && prerelease="--prerelease"
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease \
              --title "$TAG" --generate-notes
          else
            if gh release view prerelease --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete prerelease --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
            gh release create prerelease dist/* --repo "$GITHUB_REPOSITORY" --prerelease \
              --target "$GITHUB_SHA" --title prerelease --notes ""
          fi
