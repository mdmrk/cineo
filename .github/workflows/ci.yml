name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2.88.1
        with:
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2
      - run: scripts/check.sh
        env:
          NEXTEST_PROFILE: ci

  build:
    name: build
    needs: check
    if: >-
      github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') ||
      !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p cineo-desktop --locked --release
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v2
      - run: scripts/package.sh
      - run: cd dist && sha256sum -- * > SHA256SUMS
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish the release or the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then
            prerelease=""
            [[ "$TAG" == *-* ]] && prerelease="--prerelease"
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease \
              --title "$TAG" --generate-notes
          else
            if gh release view prerelease --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete prerelease --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
            gh release create prerelease dist/* --repo "$GITHUB_REPOSITORY" --prerelease \
              --target "$GITHUB_SHA" --title prerelease --notes ""
          fi
