name: ci

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  NEXTEST_PROFILE: ci

jobs:
  linux:
    name: check (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - &checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - &unoptimized-deps
        name: Build the dependencies unoptimized
        run: mkdir -p .cargo && printf '[profile.dev.package."*"]\nopt-level = 0\n' > .cargo/config.toml
      - &install-rust
        run: scripts/install-rust.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c
        with:
          tool: cargo-nextest@0.9.152,cargo-deny@0.22.0,taplo@0.10.0,typos@1.52.2,cargo-machete@0.10.1,shellcheck@0.11.0,shfmt@3.14.1
      - &minisign
        run: scripts/release.sh tool "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: rustup target add wasm32-unknown-unknown
      - run: scripts/check.sh
      - run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends libmpv2 > /dev/null
      - run: cargo nextest run -p cineo-player --locked --run-ignored only

  windows:
    name: check (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - *checkout
      - *unoptimized-deps
      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0
        with:
          drive-size: 14GB
          workspace-copy: true
      - *install-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
      - run: cargo nextest run --workspace --locked
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}

  macos:
    name: check (macos)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - *checkout
      - *unoptimized-deps
      - *install-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked

  android:
    name: check (android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - *checkout
      - &install-rust-android
        run: scripts/install-rust.sh aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-android
      - run: source scripts/libmpv-android.env && cargo ndk -t arm64-v8a -P "$ANDROID_API" clippy -p cineo-android --locked -- -D warnings
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
        working-directory: android
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

  build:
    name: build (${{ matrix.platform }})
    if: &release-push >-
      github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') ||
      !startsWith(github.event.head_commit.message, 'chore(release):'))
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux, os: ubuntu-24.04 }
          - { platform: windows, os: windows-latest, features: bundled-libmpv }
          - { platform: macos, os: macos-latest, targets: aarch64-apple-darwin x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions: &attest
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - *checkout
      - &check-tag
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/release.sh version "$TAG" && scripts/release.sh notes
        env:
          TAG: ${{ github.ref_name }}
      - run: scripts/install-rust.sh $TARGETS
        env:
          TARGETS: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch libmpv
        if: matrix.features == 'bundled-libmpv'
        run: |
          scripts/fetch-libmpv.sh windows libmpv
          echo "CINEO_LIBMPV_DLL_GZ=$(cygpath -m "$PWD/libmpv/libmpv-2.dll.gz")" >> "$GITHUB_ENV"
      - name: Fetch libmpv (macOS)
        if: matrix.platform == 'macos'
        run: scripts/fetch-libmpv.sh macos target/libmpv-macos
      - name: Build
        run: |
          if [[ -n "$TARGETS" ]]; then
            cargo build -p cineo-desktop --locked --release $(printf -- '--target %s ' $TARGETS)
          else
            cargo build -p cineo-desktop --locked --release ${FEATURES:+--features "$FEATURES"}
          fi
        env:
          CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/') && 'thin' || 'off' }}
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '16' }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: &x86-64-v2 -C target-cpu=x86-64-v2
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: *x86-64-v2
          CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS: *x86-64-v2
          FEATURES: ${{ matrix.features }}
          TARGETS: ${{ matrix.targets }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - run: scripts/package.sh "$PLATFORM"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  build-android:
    name: build (android)
    if: *release-push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: *attest
    steps:
      - *checkout
      - *check-tag
      - *install-rust-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          shared-key: android-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-android
      - id: libmpv
        uses: actions/cache/restore@v6.1.0
        with:
          path: &libmpv-android-paths |
            target/libmpv-android/out
            target/libmpv-android/pins
          key: &libmpv-android-key libmpv-android-${{ hashFiles('scripts/build-libmpv-android.sh', 'scripts/libmpv-android.env') }}
      - if: steps.libmpv.outputs.cache-hit != 'true'
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y -qq ninja-build > /dev/null
      - run: base64 -d <<<"$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/cineo-release.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - run: scripts/release-android.sh
        env:
          CINEO_KEYSTORE: ${{ runner.temp }}/cineo-release.jks
          CINEO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CINEO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CINEO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - if: github.ref == 'refs/heads/main' && steps.libmpv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: *libmpv-android-paths
          key: *libmpv-android-key
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: [linux, windows, macos, android, build, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-signing
    permissions:
      contents: write
    steps:
      - *checkout
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: scripts/release.sh assets dist
      - run: cd dist && sha256sum -- * > SHA256SUMS
      - *minisign
      - run: scripts/release.sh sign dist "$RELEASE"
        env:
          CINEO_MINISIGN_KEY: ${{ secrets.CINEO_MINISIGN_KEY }}
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'prerelease' }}
      - name: Publish the release or the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then
            prerelease=""
            [[ "$TAG" == *-* ]] && prerelease="--prerelease"
            previous=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
            scripts/release.sh body "$TAG" "$previous" > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease \
              --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            if gh release view prerelease --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/prerelease" -f sha="$GITHUB_SHA" -F force=true > /dev/null
              gh release upload prerelease dist/* --repo "$GITHUB_REPOSITORY" --clobber
            else
              gh release create prerelease dist/* --repo "$GITHUB_REPOSITORY" --prerelease \
                --target "$GITHUB_SHA" --title prerelease --notes ""
            fi
          fi

  reproduce-android:
    name: reproduce (android)
    if: github.event_name == 'push'
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - *checkout
      - name: Free disk space for the F-Droid build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: docker run --rm -v "$PWD:/cineo:ro" registry.gitlab.com/fdroid/fdroidserver:buildserver /cineo/scripts/check-fdroid-build.sh "$GITHUB_SHA" "$RELEASE"
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'prerelease' }}

  prune-caches:
    name: prune caches
    needs: [linux, windows, macos, android, build, build-android]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete the superseded Rust and libmpv caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref refs/heads/main --limit 1000 --json id,key,createdAt --jq '
            map(select(.key | test("^(v0-rust-|libmpv-android-)")))
            | group_by(.key | sub("(-[0-9a-f]{8}){2}$|-[0-9a-f]{64}$"; ""))
            | map(sort_by(.createdAt) | .[:-1][]) | .[].id' |
            while read -r id; do gh cache delete "$id" || true; done
