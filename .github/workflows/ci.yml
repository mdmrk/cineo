name: ci

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: check (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2.88.1
        with:
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2
      - run: scripts/check.sh
        env:
          NEXTEST_PROFILE: ci

  windows:
    name: check (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2.88.1
        with:
          tool: cargo-nextest@0.9.150
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked
        env:
          NEXTEST_PROFILE: ci

  android:
    name: check (android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy --target aarch64-linux-android && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2.88.1
        with:
          tool: cargo-ndk@4.1.2
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" > /dev/null
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370" cargo ndk -t arm64-v8a -P 26 clippy -p cineo-android --locked -- -D warnings
      - run: ./gradlew assembleDebug
        working-directory: android

  build:
    name: build (${{ matrix.platform }})
    needs: [linux, windows, android]
    if: >-
      github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') ||
      !startsWith(github.event.head_commit.message, 'chore(release):'))
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux, os: ubuntu-latest }
          - { platform: windows, os: windows-latest, features: bundled-libmpv }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch libmpv
        if: matrix.features == 'bundled-libmpv'
        run: |
          scripts/fetch-libmpv.sh libmpv
          echo "CINEO_LIBMPV_DLL=$(cygpath -m "$PWD/libmpv/libmpv-2.dll")" >> "$GITHUB_ENV"
      - run: cargo build -p cineo-desktop --locked --release ${FEATURES:+--features "$FEATURES"}
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v2
          FEATURES: ${{ matrix.features }}
      - run: scripts/package.sh "$PLATFORM"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- * > SHA256SUMS
      - name: Publish the release or the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then
            prerelease=""
            [[ "$TAG" == *-* ]] && prerelease="--prerelease"
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease \
              --title "$TAG" --generate-notes
          else
            if gh release view prerelease --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete prerelease --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
            gh release create prerelease dist/* --repo "$GITHUB_REPOSITORY" --prerelease \
              --target "$GITHUB_SHA" --title prerelease --notes ""
          fi
