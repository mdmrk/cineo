# cargo-deny configuration. Run: `cargo deny check`. Rationale: docs/dev/DEPENDENCIES.md.

[graph]
all-features = true

[advisories]
# Unmaintained/unsound/yanked crates are reported; vulnerabilities always fail.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with distributing Cineo under MIT.
# Extend this list only when a new dependency needs it, and record why in
# docs/LEGAL.md.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    # webpki-root-certs: Mozilla's CA bundle data.
    "CDLA-Permissive-2.0",
]
unused-allowed-license = "allow"
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # TLS: we standardize on rustls; OpenSSL adds a system dependency.
    { crate = "openssl-sys", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
