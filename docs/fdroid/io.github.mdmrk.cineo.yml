      - tests/net/zeros-1mib.json.gz
    gradle:
      - yes
    build: RUSTUP_HOME=/home/vagrant/.rustup CARGO_HOME=/home/vagrant/.cargo ANDROID_NDK_HOME=$$NDK$$
