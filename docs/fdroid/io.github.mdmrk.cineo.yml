Builds:
  - versionName: 1.7.1
    versionCode: 10701
    commit: v1.7.1
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y ninja-build pkg-config python3-venv
      - curl -Lo /tmp/rustup-init.sh https://sh.rustup.rs
      - export CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup
      - sh /tmp/rustup-init.sh -y --no-modify-path --profile minimal --default-toolchain
        1.99.1 --target aarch64-linux-android
      - /opt/cargo/bin/cargo install cargo-ndk --version 4.1.2 --locked
      - chmod -R a+rwX /opt/cargo /opt/rustup
      - ln -s /opt/cargo/bin/* /usr/local/bin/
    gradle:
      - yes
    build: RUSTUP_HOME=/opt/rustup CARGO_HOME=/opt/cargo ANDROID_NDK_HOME=$$NDK$$
      ../../scripts/build-libmpv-android.sh
    ndk: 30.0.16248370

