<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Cineo architecture: shells → IO crates → cineo-core</title>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#606c7b"/>
    </marker>
    <marker id="arrow-start" markerWidth="9" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="9 0, 0 3.5, 9 7" fill="#606c7b"/>
    </marker>
    <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#34c77b"/>
    </marker>
    <style>
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .name { fill: #f1f4f7; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .sub { fill: #8b98a8; font-size: 12px; text-anchor: middle; }
      .layer { fill: #606c7b; font-size: 11px; font-weight: 600; letter-spacing: 1.4px; }
      .line { fill: none; stroke: #606c7b; stroke-width: 1.4; }
      .shell { fill: #1b2128; stroke: #c3ccd6; stroke-width: 1.5; }
      .io { fill: #221f1b; stroke: #f2a14b; stroke-width: 1.5; }
      .core { fill: #18261f; stroke: #34c77b; stroke-width: 1.5; }
      .ext { fill: #1b2128; stroke: #606c7b; stroke-width: 1.3; stroke-dasharray: 4,3; }
    </style>
  </defs>

  <rect width="1000" height="550" fill="#14181d"/>

  <text x="40" y="52" fill="#f1f4f7" font-size="28" font-family="'DM Serif Display', Georgia, 'Times New Roman', serif">Cineo architecture</text>
  <text x="40" y="78" fill="#8b98a8" font-size="13">Dependencies point down: shells → IO crates → core</text>

  <text x="40" y="153" class="layer">SHELLS</text>
  <text x="40" y="287" class="layer">IO</text>
  <text x="40" y="480" class="layer">CORE</text>
  <text x="790" y="128" class="layer">EXTERNAL</text>

  <path class="line" d="M255 180 V214"/>
  <path class="line" d="M660 180 V214"/>
  <path class="line" d="M172 214 H678.5"/>
  <path class="line" d="M261.5 214 V248" marker-end="url(#arrow)"/>
  <path class="line" d="M400.5 214 V248" marker-end="url(#arrow)"/>
  <path class="line" d="M539.5 214 V248" marker-end="url(#arrow)"/>
  <path class="line" d="M678.5 214 V248" marker-end="url(#arrow)"/>
  <path d="M172 214 V438" fill="none" stroke="#34c77b" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path class="line" d="M532 148 H578" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>

  <path class="line" d="M740 266 H762 V162 H788" marker-end="url(#arrow)"/>
  <path class="line" d="M740 298 H774 V222 H788" marker-end="url(#arrow)"/>
  <path class="line" d="M539.5 314 V342 H788" marker-end="url(#arrow)"/>
  <path class="line" d="M400.5 314 V402 H788" marker-end="url(#arrow)"/>

  <rect class="shell" x="150" y="116" width="210" height="64" rx="6"/>
  <text class="name mono" x="255" y="143">cineo-desktop</text>
  <text class="sub" x="255" y="163">egui</text>

  <rect class="shell" x="390" y="116" width="140" height="64" rx="6"/>
  <text class="name mono" x="460" y="143">android/</text>
  <text class="sub" x="460" y="163">Kotlin</text>

  <rect class="shell" x="580" y="116" width="160" height="64" rx="6"/>
  <text class="name mono" x="660" y="143">cineo-android</text>
  <text class="sub" x="660" y="163">Rust shell</text>

  <rect class="io" x="200" y="250" width="123" height="64" rx="6"/>
  <text class="name mono" x="261.5" y="277">cineo-store</text>
  <text class="sub" x="261.5" y="297">SQLite</text>

  <rect class="io" x="339" y="250" width="123" height="64" rx="6"/>
  <text class="name mono" x="400.5" y="277">cineo-player</text>
  <text class="sub" x="400.5" y="297">playback</text>

  <rect class="io" x="478" y="250" width="123" height="64" rx="6"/>
  <text class="name mono" x="539.5" y="277">cineo-stream</text>
  <text class="sub" x="539.5" y="297">torrents</text>

  <rect class="io" x="617" y="250" width="123" height="64" rx="6"/>
  <text class="name mono" x="678.5" y="277">cineo-net</text>
  <text class="sub" x="678.5" y="297">all HTTP</text>

  <rect class="core" x="150" y="440" width="590" height="70" rx="6"/>
  <text class="name mono" x="445" y="470" font-size="15">cineo-core</text>
  <text class="sub" x="445" y="491">pure domain and protocol logic, no IO</text>

  <rect class="ext" x="790" y="140" width="170" height="44" rx="6"/>
  <text class="name" x="875" y="167">Addons</text>

  <rect class="ext" x="790" y="200" width="170" height="44" rx="6"/>
  <text class="name" x="875" y="227">Sync server</text>

  <rect class="ext" x="790" y="320" width="170" height="44" rx="6"/>
  <text class="name" x="875" y="347">BitTorrent peers</text>

  <rect class="ext" x="790" y="380" width="170" height="44" rx="6"/>
  <text class="name" x="875" y="407">libmpv</text>
</svg>
