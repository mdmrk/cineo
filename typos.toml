[files]
extend-exclude = [
    "Cargo.lock",
    "android/gradle/**",
    "android/gradlew*",
    "fastlane/**",
    "crates/cineo-desktop/assets/i18n/**",
    "android/app/src/main/res/values-*/**",
]

[default.extend-words]
fre = "fre"
tha = "tha"
strem = "strem"
abd = "abd"
seeked = "seeked"

[default]
extend-ignore-re = ["UPnP", "PNGs?", "UNKNOWNs", "[0-9a-f]{3,}…[0-9a-f]{3,}"]
