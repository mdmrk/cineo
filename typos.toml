[files]
extend-exclude = [
    "scripts/windows/licenses/**",
    "android/rustls-platform-verifier/**",
    "fastlane/**",
    "crates/cineo-desktop/assets/i18n/**",
    "android/app/src/main/res/values-*/**",
]

[default.extend-words]
fre = "fre"
tha = "tha"
strem = "strem"
abd = "abd"
seeked = "seeked"
flate = "flate"

[default]
extend-ignore-re = ["UPnP", "PNGs?", "UNKNOWNs", "RW[A-Za-z0-9+/]{54}", "\"[A-Za-z0-9_-]{43}\""]
